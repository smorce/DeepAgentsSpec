name: Quality Gates

on:
  pull_request:
  workflow_dispatch:

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install --upgrade uv

      - name: Run format and lint checks
        run: bash scripts/format_or_lint.sh

      - name: Validate spec checklists
        run: bash scripts/validate_spec.sh

      - name: Validate plan checklists
        run: bash scripts/validate_plan.sh

      - name: Validate agent radar SoR
        run: uv run --no-project --link-mode=copy python harness/agent_radar/radar_ops.py --mode validate

      - name: Validate doc gardening
        run: bash scripts/garden_agent_docs.sh

      - name: Run unit test scripts
        run: bash scripts/run_all_unit_tests.sh

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Puppeteer
        run: npm install --no-save puppeteer

      - name: Run E2E tests
        run: bash scripts/run_all_e2e_tests.sh
