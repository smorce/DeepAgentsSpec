name: Agent Radar Daily Cycle

on:
  schedule:
    - cron: "15 0 * * *"
  workflow_dispatch:

concurrency:
  group: agent-radar-daily
  cancel-in-progress: false

jobs:
  run-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install --upgrade uv

      - name: Run baseline quality checks
        run: bash scripts/format_or_lint.sh

      - name: Run agent radar unified pipeline
        run: uv run --no-project --link-mode=copy python harness/agent_radar/radar_ops.py --mode pipeline --collector auto --self-heal-max-retries 2

      - name: Run unit test scripts
        run: bash scripts/run_all_unit_tests.sh

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Puppeteer
        run: npm install --no-save puppeteer

      - name: Run E2E tests
        run: bash scripts/run_all_e2e_tests.sh

      - name: Enforce SoR allowlist
        run: |
          CHANGED="$(git status --porcelain | awk '{print $2}')"
          if [[ -z "${CHANGED}" ]]; then
            echo "No changes detected."
            exit 0
          fi
          echo "Changed files:"
          echo "${CHANGED}"
          while IFS= read -r file; do
            [[ -z "${file}" ]] && continue
            case "${file}" in
              harness/agent_radar/*|harness/worktree/*|docs/agent-harness/*|docs/reports/source-radar/*|harness/AI-Agent-progress.txt|scripts/*)
                ;;
              *)
                echo "ERROR: out-of-scope change detected: ${file}" >&2
                exit 1
                ;;
            esac
          done <<< "${CHANGED}"

      - name: Create PR for SoR updates
        uses: peter-evans/create-pull-request@v6
        with:
          branch: "bot/agent-radar-daily"
          commit-message: "chore: Agent Radar自律成長の日次更新"
          title: "chore: Agent Radar自律成長の日次更新"
          body: |
            日次の Agent Radar 実行結果を SoR 許可範囲内で更新しました。
            - pipeline: 実行済み
            - unit tests: 実行済み
            - e2e tests: 実行済み
            - allowlist: 検証済み
          labels: |
            automation
            agent-radar
          add-paths: |
            harness/agent_radar/**
            harness/worktree/**
            docs/agent-harness/**
            docs/reports/source-radar/**
            harness/AI-Agent-progress.txt
            scripts/**
