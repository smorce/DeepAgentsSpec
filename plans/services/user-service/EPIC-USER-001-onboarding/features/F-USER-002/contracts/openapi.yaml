openapi: 3.1.0
info:
  title: User Signup API
  version: 0.1.0
paths:
  /api/users:
    post:
      summary: Signup user
      operationId: signupUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 8
      responses:
        '201':
          description: User created
        '400':
          description: Validation error
        '409':
          description: Email already exists
