openapi: 3.1.0
info:
  title: API Gateway Health API
  version: 0.1.0
paths:
  /health:
    get:
      summary: Health check endpoint
      operationId: getHealth
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                required: [status, service]
                properties:
                  status:
                    type: string
                    example: ok
                  service:
                    type: string
                    example: api-gateway
                  timestamp:
                    type: string
                    format: date-time
